<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: deep dark with subtle blue tint -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>

    <!-- Icon gradient: indigo to violet -->
    <linearGradient id="bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>

    <!-- Rounded rect clip -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Subtle radial glow behind bolt -->
  <radialGradient id="radialGlow" cx="50%" cy="48%" r="40%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="512" cy="490" rx="320" ry="280" fill="url(#radialGlow)"/>

  <!-- Lightning bolt — clean, geometric, slightly rounded -->
  <!-- Top triangle: points right-down -->
  <!-- Full bolt path centered at 512,512 -->
  <g filter="url(#shadow)">
    <path
      d="M 580 140
         L 340 560
         L 470 560
         L 430 880
         L 690 440
         L 555 440
         Z"
      fill="url(#bolt)"
      filter="url(#glow)"
    />
  </g>

  <!-- Subtle inner highlight on bolt top edge -->
  <path
    d="M 580 140
       L 340 560
       L 390 560
       L 580 200
       Z"
    fill="white"
    opacity="0.12"
  />
</svg>
